[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-rps-protocol"
version = "0.2.0"
description = "A CLI rock-paper-scissors game between two independent language models."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1"]

[project.scripts]
model-rps = "model_rps.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
